name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: CI — Lint, Type Check, Build (shared across all jobs)
  # ─────────────────────────────────────────────────────────────
  ci:
    name: "🔍 Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Build
        run: pnpm turbo run build

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy — chỉ chạy khi push lên main và CI pass
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy ${{ matrix.app }}"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mama-hub-finance-app
            project_id_secret: VERCEL_PROJECT_ID_FINANCE
          - app: mama-hub-baby-app
            project_id_secret: VERCEL_PROJECT_ID_BABY
          - app: mama-hub-shell-app
            project_id_secret: VERCEL_PROJECT_ID_SHELL

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if ${{ matrix.app }} has changes (turbo-ignore)
        id: changes
        run: |
          # turbo-ignore: exit 1 = có thay đổi → deploy
          #               exit 0 = không có thay đổi → skip
          if npx turbo-ignore ${{ matrix.app }}; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ No changes detected in ${{ matrix.app }}, skipping deploy."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in ${{ matrix.app }}, proceeding with deploy."
          fi

      - name: Deploy ${{ matrix.app }} → Vercel (Production)
        if: steps.changes.outputs.skip == 'false'
        run: |
          npx vercel@latest deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Preview — deploy preview cho PRs
  # ─────────────────────────────────────────────────────────────
  preview:
    name: "👁️ Preview ${{ matrix.app }}"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mama-hub-finance-app
            project_id_secret: VERCEL_PROJECT_ID_FINANCE
          - app: mama-hub-baby-app
            project_id_secret: VERCEL_PROJECT_ID_BABY
          - app: mama-hub-shell-app
            project_id_secret: VERCEL_PROJECT_ID_SHELL

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if ${{ matrix.app }} has changes
        id: changes
        run: |
          if npx turbo-ignore ${{ matrix.app }}; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ No changes detected in ${{ matrix.app }}, skipping preview."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in ${{ matrix.app }}, proceeding with preview."
          fi

      - name: Deploy ${{ matrix.app }} → Vercel (Preview)
        if: steps.changes.outputs.skip == 'false'
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel@latest deploy --yes \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}

      - name: Comment Preview URL on PR
        if: steps.changes.outputs.skip == 'false' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👁️ **Preview deployed for \`${{ matrix.app }}\`**: ${{ steps.deploy.outputs.url }}`
            })
