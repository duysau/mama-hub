name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm turbo run lint

      - name: Build & Type Check
        run: pnpm turbo run build

  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mama-hub-finance-app
            project_id_secret: VERCEL_PROJECT_ID_FINANCE
          - app: mama-hub-baby-app
            project_id_secret: VERCEL_PROJECT_ID_BABY
          - app: mama-hub-shell-app
            project_id_secret: VERCEL_PROJECT_ID_SHELL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check if ${{ matrix.app }} has changes
        id: check
        run: |
          # turbo-ignore exit 0 = no changes → skip
          # turbo-ignore exit 1 = has changes → deploy
          if npx turbo-ignore ${{ matrix.app }}; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes in ${{ matrix.app }}, skipping."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in ${{ matrix.app }}, deploying."
          fi

      - name: Deploy ${{ matrix.app }} to Vercel (Production)
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          npx vercel@latest deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}

      - name: Deploy ${{ matrix.app }} to Vercel (Preview)
        if: steps.check.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: preview
        run: |
          DEPLOYMENT_URL=$(npx vercel@latest deploy --yes \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}

      - name: Comment Preview URL on PR
        if: steps.check.outputs.changed == 'true' && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👁️ **Preview deployed for \`${{ matrix.app }}\`**: ${{ steps.preview.outputs.url }}`
            })
