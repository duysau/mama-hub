name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm turbo run lint

      - name: Build & Type Check
        run: pnpm turbo run build

  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: ci # chỉ deploy nếu CI pass
    strategy:
      matrix:
        include:
          - app: mama-hub-finance-app
            project_id_secret: VERCEL_PROJECT_ID_FINANCE
          - app: mama-hub-baby-app
            project_id_secret: VERCEL_PROJECT_ID_BABY
          - app: mama-hub-shell-app
            project_id_secret: VERCEL_PROJECT_ID_SHELL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check if ${{ matrix.app }} has changes
        id: check
        run: |
          if npx turbo-ignore ${{ matrix.app }}; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Deploy ${{ matrix.app }} to Vercel
        if: steps.check.outputs.changed == 'true'
        run: |
          pnpm add -g vercel
          if [ "${{ github.event_name }}" == "push" ]; then
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
          else
            vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
